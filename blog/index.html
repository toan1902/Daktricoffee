<style>
  :root {
    --cream: #f5f0e0;
    --paper: #faf6e9;
    --ink: #1c1208;
    --ink-soft: #3d2c1a;
    --ink-mid: #5d4830;
    --moss: #2e6b3f;
    --moss-deep: #1f4a2c;
    --gold: #d4af4c;
    --rule: #c9b88a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Be Vietnam Pro', sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }
  .brand {
    text-align: center;
    margin-bottom: 56px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--rule);
  }
  .brand-tag {
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--moss);
    font-weight: 600;
    margin-bottom: 14px;
  }
  .brand-name {

  .brand-name em {

    color: var(--moss-deep);

  }
  .brand-desc {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--ink-mid);
    max-width: 540px;
    margin: 0 auto;
  }
  .section-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 28px;
    color: var(--ink);
    margin: 0 0 28px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .section-title::before {
    content: "";
    width: 32px; height: 3px;
    background: var(--moss);
  }
  .post-list {
    list-style: none;
    padding: 0;
    margin: 0;

  .post {
    display: block;
    padding: 24px 0;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s;
  }
  .post:hover { transform: translateX(4px); }
  .post-date {
    font-size: 12px;

    text-transform: uppercase;

  .post-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(22px, 3vw, 28px);
    line-height: 1.25;
    color: var(--ink);
    margin: 0 0 10px;
    font-variation-settings: "opsz" 144;
  }
  .post-title em {
    font-style: italic;
    color: var(--moss-deep);

  .post-desc {

}
.page-btn {

<body>
<div class="container">

  <header class="brand">
    <div class="brand-tag">HTX Daktri Khe Sanh · Vinaxanh Quảng Trị</div>
    <h1 class="brand-name">Nông nghiệp <em>tử tế</em></h1>
    <p class="brand-desc">Kiến thức về đất, cà phê Liberica, và cách nuôi vườn cây bằng triết lý hữu cơ — chia sẻ từ HTX Daktri Khe Sanh và Vinaxanh Quảng Trị.</p>
  </header>

  <h2 class="section-title">Bài viết</h2>

  <ul class="post-list" id="post-list">
  
  </ul>

  <footer>
    <div>© 2026 HTX Daktri Khe Sanh · Vinaxanh Quảng Trị</div>
    <div class="phone">Hotline / Zalo: 0941 336 669</div>
  </footer>

</div>
<script>
// ======================= CONFIG =======================
const API_BASE = 'https://libericakhesanh.net/api/index.php';

// ======================= LOAD BLOGS WITH PAGINATION =======================
async function loadBlogs(page = 1) {
  const listEl = document.getElementById('post-list');
  listEl.innerHTML = '<li class="loading">Đang tải bài viết...</li>';

  try {
    const res = await fetch(`${API_BASE}?table=blogs&action=list&page=${page}&limit=12`);
    const result = await res.json();

    console.log("DATA FROM SERVER:", result);

    if (!res.ok || result.status === 'error') {
      throw new Error(result.msg || 'Không thể tải danh sách bài viết');
    }

    const blogs = result.data || [];
    const pagination = result.pagination || {};

    listEl.innerHTML = '';

    if (blogs.length === 0) {
      listEl.innerHTML = '<li style="padding: 40px 0; text-align: center; color: #888;">Chưa có bài viết nào.</li>';
      return;
    }

    blogs.forEach(blog => {
      if (!blog.slug || !blog.title) return;

      const date = formatDate(blog.created_at || blog.updated_at || '');

      const item = document.createElement('a');
      item.href = `blog-detail.html?slug=${encodeURIComponent(blog.slug)}`;
      item.className = 'post';
      item.innerHTML = `
        <div class="post-date">${date}</div>
        <h3 class="post-title">${escapeHtml(blog.title)}</h3>
        <p class="post-desc">${escapeHtml(blog.excerpt || '')}</p>
      `;
      listEl.appendChild(item);
    });

    // Hiển thị phân trang
    renderPagination(pagination);

  } catch (err) {
    console.error(err);
    listEl.innerHTML = `
      <li style="padding: 40px 0; text-align: center; color: #c00;">
        Không thể tải danh sách bài viết.<br>
        <small>Vui lòng thử tải lại trang.</small>
      </li>`;
  }
}

// ======================= RENDER PAGINATION =======================
function renderPagination(pagination) {
  const { current_page, total_pages } = pagination;
  if (!total_pages || total_pages <= 1) return;

  const paginationHTML = `
    <div class="pagination" style="margin-top: 30px; text-align: center;">
      ${current_page > 1 ? 
        `<button onclick="loadBlogs(${current_page - 1})" class="page-btn">← Trước</button>` : ''}
      
      <span style="margin: 0 15px; font-weight: 500;">
        Trang ${current_page} / ${total_pages}
      </span>
      
      ${current_page < total_pages ? 
        `<button onclick="loadBlogs(${current_page + 1})" class="page-btn">Sau →</button>` : ''}
    </div>
  `;

  // Thêm phân trang vào sau danh sách
  const listEl = document.getElementById('post-list');
  listEl.insertAdjacentHTML('afterend', paginationHTML);
}

// ======================= HELPERS =======================
function formatDate(raw) {
  if (!raw) return 'N/A';
  const d = new Date(raw);
  if (isNaN(d.getTime())) return String(raw).slice(0, 10);
  return `${d.getDate().toString().padStart(2,'0')} · ${(d.getMonth()+1).toString().padStart(2,'0')} · ${d.getFullYear()}`;
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Load khi trang sẵn sàng
document.addEventListener('DOMContentLoaded', () => {
  loadBlogs(1);
});
</script>

</body>
